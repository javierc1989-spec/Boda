lay:flex;gap:10px}.modal button{flex:1;padding:11px;border-radius:8px;border:0;cursor:pointer;font-weight:bold}.answer-btn{background:#c8a96b;color:#16110a}.cancel-btn{background:#3b333d;color:#fff}#modalMsg{min-height:22px;font-weight:bold}#success{display:none;text-align:center;margin-top:22px}#success img{width:100%;max-width:650px;border-radius:12px;display:block;margin:auto}@media(max-width:600px){.terminal{padding:18px}.digits{gap:6px}.reveal{font-size:10px;padding:5px}.celebration{font-size:23px}}

const clues=[
{question:"¿Cuál es el sabor de la base?",answers:["sacher","tarta sacher","tarta reseca"],digit:SECRET_CODE[0]},
{question:"¿Cuál es el sabor de la cuesta?",answers:["donut","donuts","tarta de donuts"],digit:SECRET_CODE[1]},

function closeClue(){modalBg.style.display="none";currentClue=null}
